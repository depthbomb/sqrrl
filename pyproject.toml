[build-system]
requires = ['setuptools>=84.0.0']
build-backend = 'setuptools.build_meta'

[project]
name = 'sqrrl'
version = '0.4.2'
description = 'Generated typed async data access and checked migrations for SQLite and PostgreSQL'
readme = 'README.md'
requires-python = '>=3.14'
license = 'MIT'
license-files = ['LICENSE']
dependencies = ['aiosqlite>=0.22']
authors = [{ name = 'depthbomb' }]
keywords = ['sqlite', 'postgresql', 'async', 'database', 'migrations', 'code-generation', 'typing']
classifiers = [
    'Development Status :: 3 - Alpha',
    'Intended Audience :: Developers',
    'Operating System :: OS Independent',
    'Programming Language :: Python :: 3',
    'Programming Language :: Python :: 3 :: Only',
    'Programming Language :: Python :: 3.14',
    'Programming Language :: Python :: 3.15',
    'Programming Language :: Python :: Implementation :: CPython',
    'Typing :: Typed',
]

[project.urls]
Documentation = 'https://github.com/depthbomb/sqrrl#readme'
Source = 'https://github.com/depthbomb/sqrrl'
Issues = 'https://github.com/depthbomb/sqrrl/issues'
Releases = 'https://github.com/depthbomb/sqrrl/releases'

[project.optional-dependencies]
pg = [
    'asyncpg>=0.31.0; python_version < "3.15"',
    'asyncpg>=0.32.0; python_version >= "3.15"',
]
dev = [
    'asyncpg-stubs>=0.31.3',
    'build>=1.2',
    'mypy>=1.18.2',
    'pyright>=1.1.407',
    'pytest>=8',
    'pytest-asyncio>=1',
    'pytest-cov>=7',
    'ruff>=0.14',
    'twine>=6',
]

[project.scripts]
sqrrl = 'sqrrl.cli:main'

[tool.setuptools.packages.find]
where = ['.']
include = ['sqrrl', 'sqrrl.*']

[tool.setuptools.package-data]
sqrrl = ['py.typed']

[tool.pytest.ini_options]
testpaths = ['tests']
pythonpath = ['tests']
addopts = "-ra --strict-config --strict-markers -m 'not stress'"
markers = ['stress: larger workloads excluded by default; run with -m stress']
asyncio_mode = 'auto'
asyncio_default_fixture_loop_scope = 'function'

[tool.coverage.run]
branch = true
patch = ['subprocess']

[tool.coverage.report]
precision = 2

[tool.mypy]
python_version = '3.14'
strict = true
files = ['sqrrl', 'examples']

[tool.pyright]
include = ['sqrrl', 'examples']
pythonVersion = '3.14'
typeCheckingMode = 'standard'
venvPath = '.'
venv = '.venv'

[tool.ruff]
target-version = 'py314'
line-length = 120

[tool.ruff.lint]
select = ['E4', 'E7', 'E9', 'F']

[tool.ruff.format]
quote-style = 'single'
